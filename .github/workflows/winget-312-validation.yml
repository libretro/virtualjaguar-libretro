name: Validate Virtual Jaguar 3.12.0 WinGet package

on:
  push:
    branches: [codex/winget-312-validation]

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      VJ_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate WinGet manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-WinGet {
            $package = Get-AppxPackage Microsoft.DesktopAppInstaller |
              Sort-Object Version -Descending | Select-Object -First 1
            if ($package) { Join-Path $package.InstallLocation winget.exe }
          }
          $cli = Find-WinGet
          if (!$cli -or [version]((& $cli --version).TrimStart('v')) -lt [version]'1.28') {
            Install-Module Microsoft.WinGet.Client -Repository PSGallery -Force -Scope CurrentUser
            Repair-WinGetPackageManager -Latest -Force
            $cli = Find-WinGet
          }
          if (!$cli) { throw 'App Installer is unavailable on this runner' }
          & $cli --version
          "VJ_WINGET=$cli" >> $env:GITHUB_ENV
          & $cli validate --manifest .github/winget-312
          if ($LASTEXITCODE -ne 0) { throw "winget validate exited $LASTEXITCODE" }
      - name: Install, boot YARC and uninstall without interaction
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "VirtualJaguar-3.12.0-windows-$env:VJ_ARCH-setup.exe"
          $url = "https://github.com/libretro/virtualjaguar-libretro/releases/download/v3.12.0/$name"
          $installer = Join-Path $env:RUNNER_TEMP $name
          curl.exe --fail --location --retry 3 --output $installer $url
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          $manifest = Get-Content .github/winget-312/Libretro.VirtualJaguar.installer.yaml -Raw
          $expected = [regex]::Match($manifest, [regex]::Escape($url) + '\r?\n\s+InstallerSha256: ([A-F0-9]{64})').Groups[1].Value
          if (!$expected -or (Get-FileHash $installer).Hash -ne $expected) { throw 'Installer hash mismatch' }
          $dest = Join-Path $env:RUNNER_TEMP 'vj-unattended'
          $log = Join-Path $env:RUNNER_TEMP 'vj-setup.log'
          & $env:VJ_WINGET settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw "Enabling local manifests exited $LASTEXITCODE" }
          $installArgs = @('install', '--manifest', '.github/winget-312',
            '--architecture', $env:VJ_ARCH, '--scope', 'user', '--silent',
            '--disable-interactivity', '--accept-source-agreements', '--accept-package-agreements',
            '--location', $dest, '--log', $log, '--verbose-logs')
          & $env:VJ_WINGET @installArgs
          if ($LASTEXITCODE -ne 0) { throw "WinGet install exited $LASTEXITCODE" }
          $exe = Join-Path $dest 'virtualjaguar.exe'
          if (!(Test-Path $exe)) { throw 'Missing installed executable' }
          $p = Start-Process $exe -ArgumentList '--headless','--frames','300','--expect-hash','e33e2c61',"`"$PWD\test\roms\yarc.j64`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "YARC smoke exited $($p.ExitCode)" }
          $p = Start-Process (Join-Path $dest 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($p.ExitCode -ne 0 -or (Test-Path $exe)) { throw "Uninstall failed: $($p.ExitCode)" }
          Write-Host "PASS $env:VJ_ARCH: verified installer hash, silent install, YARC boot and silent uninstall"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: win-install-log-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/vj-setup.log
            ~/AppData/Local/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/DiagOutputDir/*.log
          if-no-files-found: ignore
