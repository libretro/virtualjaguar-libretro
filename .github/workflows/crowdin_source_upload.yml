# Prepare source texts & upload them to Crowdin

name: Crowdin Source Texts Upload

# On change to the English texts.
#
# Watches `develop`, not the default branch: this repo is GitFlow, and
# option strings land on develop first (master only receives them at
# release). Uploading from master would hold every new string back a
# whole release cycle.
on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'libretro_core_options.h'

jobs:
  upload_source_file:
    runs-on: ubuntu-latest
    steps:

      # The vendored intl/ scripts do not propagate subprocess failures
      # (upstream ships them without check=True), so an absent or empty
      # secret would otherwise produce a GREEN run that silently did
      # nothing. Fail here, before any of that runs.
      - name: Require CROWDIN_API_KEY
        env:
          CROWDIN_API_KEY: ${{ secrets.CROWDIN_API_KEY }}
        run: |
          if [ -z "$CROWDIN_API_KEY" ]; then
            echo "::error::CROWDIN_API_KEY secret is not set -- see docs/core-option-translations.md"
            exit 1
          fi
      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: 18
          distribution: zulu

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Upload Source
        shell: bash
        env:
          CROWDIN_API_KEY: ${{ secrets.CROWDIN_API_KEY }}
        run: |
          python3 intl/upload_workflow.py $CROWDIN_API_KEY "virtualjaguar-libretro" "libretro_core_options.h"
