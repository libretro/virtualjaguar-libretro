name: Regression Tests

on:
  # No `develop` in the push list: every change reaches develop through a PR that
  # already ran this workflow, so re-running it per merge mostly duplicated the PR
  # run.  (Tests do not re-run on the merged tip; release.yml still compiles every
  # develop tip for the nightly.)
  push:
    branches: [ master ]
  pull_request:
    branches: [ develop, master ]
    # A PR that changes only docs builds nothing and tests nothing, so it runs
    # none of this.  docs/cd-boot-matrix.md's format check lives in pages.yml,
    # which has its own filter.  A release PR always carries code; to run this
    # on a docs-only PR anyway, use workflow_dispatch on its branch.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Cancel stale PR runs when new commits push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  pull-requests: write

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
            core: virtualjaguar_libretro.so
            platform: linux-x64

          - os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
            core: virtualjaguar_libretro.so
            platform: linux-arm64

          - os: macos-latest
            cc: clang
            cxx: clang++
            core: virtualjaguar_libretro.dylib
            platform: macos-arm64

    name: regression-${{ matrix.config.platform }}
    # Mac Studio self-hosted runner for macOS rows on trusted events only (push,
    # schedule, dispatch, same-repo PR); fork PRs always get the hosted runner.
    # Kill switch: repository variable VJ_STUDIO_RUNNER=off.  See docs/agent/github.md.
    runs-on: ${{ matrix.config.os == 'ubuntu-latest' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(vars.VJ_TEMP_RUNNERS || '{"refs":[]}').refs, github.ref) && fromJSON(vars.VJ_TEMP_RUNNERS)['ubuntu-latest'] || matrix.config.os == 'macos-latest' && vars.VJ_STUDIO_RUNNER != 'off' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","studio","vj"]') || matrix.config.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Install ImageMagick
      run: |
        if [ "$(uname -s)" = "Darwin" ]; then
          # The Mac Studio runner is a non-admin user with imagemagick preinstalled;
          # brew would auto-update into a prefix it may not own.
          command -v magick >/dev/null || command -v convert >/dev/null || brew install imagemagick
        else
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
        fi

    - name: Cache miniretro
      id: cache-miniretro
      uses: actions/cache@v6
      with:
        path: miniretro-bin
        key: miniretro-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/regression-test.yml') }}

    - name: Build miniretro
      if: steps.cache-miniretro.outputs.cache-hit != 'true'
      run: |
        # RUNNER_TEMP, not /tmp: the self-hosted Studio runner keeps /tmp between jobs, so a
        # second run's clone would hit the first run's directory.
        SRC="$RUNNER_TEMP/miniretro-src"
        rm -rf "$SRC"
        git clone --depth 1 https://github.com/davidgfnet/miniretro.git "$SRC"
        LDFLAGS="-ldl"
        if [ "$(uname -s)" = "Darwin" ]; then LDFLAGS=""; fi
        ${{ matrix.config.cxx }} -O2 -Wall -Wno-deprecated-declarations -Wno-unused-result \
          -o miniretro-bin \
          "$SRC/miniretro.cc" \
          "$SRC/util.cc" \
          "$SRC/loader.cc" \
          $LDFLAGS

    - name: Build core
      run: make -j4 CC=${{ matrix.config.cc }} CXX=${{ matrix.config.cxx }}

    - name: Run regression tests
      run: |
        export MINIRETRO_BIN="$(pwd)/miniretro-bin"
        export DIFF_DIR="$(pwd)/regression-diffs"
        chmod +x "${MINIRETRO_BIN}"
        ./test/regression_test.sh ./${{ matrix.config.core }}

    - name: Run SRAM interface tests
      run: ./test/sram_test.sh ./${{ matrix.config.core }}

    - name: Upload diff artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: regression-diffs-${{ matrix.config.platform }}
        path: regression-diffs/
        if-no-files-found: ignore

    - name: Comment on PR with results
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const path = 'regression-diffs/summary.md';
          if (!fs.existsSync(path)) return;

          const summary = fs.readFileSync(path, 'utf8');
          const platform = '${{ matrix.config.platform }}';

          // Paginate to find existing comment even on busy PRs
          const comments = await github.paginate(
            github.rest.issues.listComments,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            }
          );
          const marker = `<!-- regression-${platform} -->`;
          const existing = comments.find(c => c.body.includes(marker));

          const hasDiffs = fs.readdirSync('regression-diffs').some(f => f.endsWith('_diff.png'));
          const body = `${marker}\n### Regression: \`${platform}\`\n\n${summary}\n\n` +
            (hasDiffs
              ? `> :warning: Visual diffs uploaded as artifacts — download \`regression-diffs-${platform}\` to inspect.\n`
              : '') +
            `\n<sub>Updated by CI at ${new Date().toISOString()}</sub>`;

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
