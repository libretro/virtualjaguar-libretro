name: Community cheat converter

on:
  push:
    branches: [develop, master]
    paths: ['tools/cheat-import/**', '.github/workflows/cheat-import.yml']
  pull_request:
    branches: [develop, master, 'release/**']
    paths: ['tools/cheat-import/**', '.github/workflows/cheat-import.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  converter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tools/cheat-import/requirements.txt
      - run: python -m unittest discover -s tools/cheat-import -v
