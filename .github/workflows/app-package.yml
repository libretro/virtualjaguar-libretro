name: App packages

# Builds every installable package of the standalone app (app/) and uploads each platform's
# FINAL, contract-named files as one workflow artifact (`app-package-<platform>`).  It never
# publishes anything: callers decide what to do with the artifacts.
#
#   release.yml  tags v*      -> release job collects the artifacts next to the core assets
#                develop      -> nightly job (names use `nightly`), updated in place
#                release/**   -> prerelease lane (names use `prerelease`)
#   app.yml      pull request -> artifacts + a sticky PR comment linking them
#   dispatch     manual run   -> artifacts only (set `sign` to exercise the signing path)
#
# Asset names (X.Y.Z = the tag without the leading v; `nightly` / `prNNN` otherwise):
#   VirtualJaguar-X.Y.Z-macos-universal.zip
#   VirtualJaguar-X.Y.Z-windows-x64.zip              VirtualJaguar-X.Y.Z-windows-x64-setup.exe
#   VirtualJaguar-X.Y.Z-windows-arm64.zip            VirtualJaguar-X.Y.Z-windows-arm64-setup.exe
#   VirtualJaguar-X.Y.Z-linux-x86_64.flatpak         VirtualJaguar-X.Y.Z-linux-aarch64.flatpak   (single-file Flatpak bundles)
#   VirtualJaguar-X.Y.Z-linux-x86_64.AppImage        VirtualJaguar-X.Y.Z-linux-aarch64.AppImage
#   virtualjaguar_X.Y.Z_amd64.deb                    virtualjaguar_X.Y.Z_arm64.deb
#
# Signing (all optional; without the secrets the macOS app is ad-hoc signed, the others unsigned, and the log says so):
#   macOS    APPLE_DEVELOPER_ID_P12_BASE64, APPLE_DEVELOPER_ID_P12_PASSWORD,
#            APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID, APPLE_NOTARY_KEY_P8_BASE64
#            (same-repo PRs, nightlies and tags all pass them; fork PRs get none, see macos-sign)
#   Windows  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC, no client secret) plus the
#            repository variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE:
#            Azure Artifact Signing of every exe/dll and both installers (#1150, composite action
#            .github/actions/windows-sign; same-repo PRs, nightlies and tags; fork PRs get none)
#   Linux    APPIMAGE_GPG_PRIVATE_KEY (+ APPIMAGE_GPG_PASSPHRASE): embedded GPG signature in both
#            AppImages (#1151), verifiable with app/packaging/linux/verify-appimage.py
# Every signing step also writes a sidecar (scripts/release/signing-status.sh, artifact
# signing-status-app-*) that release.yml's verify-signatures gate reads (#1152).
# Details: app/packaging/README.md.

on:
  workflow_call:
    inputs:
      release_tag:
        description: "v3.8.1 | nightly | prerelease | pr123 | dev"
        type: string
        required: true
      sign:
        description: "Sign (and notarize) when the secrets exist"
        type: boolean
        default: false
    secrets:
      APPLE_DEVELOPER_ID_P12_BASE64:
        required: false
      APPLE_DEVELOPER_ID_P12_PASSWORD:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false
      APPLE_NOTARY_KEY_P8_BASE64:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      APPIMAGE_GPG_PRIVATE_KEY:
        required: false
      APPIMAGE_GPG_PASSPHRASE:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Label used in the file names (v3.8.1, nightly, dev, ...)"
        type: string
        default: dev
      sign:
        description: "Sign and notarize (needs the secrets). Never publishes."
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The frame hash of the in-tree public ROM after 300 frames (app/cmake/VJSmokeTests.cmake).
  SMOKE_HASH: f4c30ea3
  SMOKE_ROM: test/roms/yarc.j64
  # Discord Rich Presence (#833): the CMake default is the project's application ID.  The repository variable
  # DISCORD_APP_ID, when set, overrides it (each configure below passes it only when non-empty, so an unset
  # variable never turns the feature off).
  DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
  # TV mode (#991): the setting a fresh config starts from.  Releases (vX.Y.Z, prerelease) start on Manual; nightly, prNNN and dev
  # builds on Auto.  Each configure below passes it as VJ_TV_DEFAULT, the Flatpak through its manifest.
  TV_DEFAULT: ${{ (startsWith(inputs.release_tag, 'v') || inputs.release_tag == 'prerelease') && 'manual' || 'auto' }}
  # The build channel (#967 3d, design section 8): nightly builds default Settings > Interface > Emulation thread to On for users
  # who never chose; releases (vX.Y.Z) and everything else (prerelease, prNNN, dev) default Off.  Each configure below passes it as
  # VJ_BUILD_CHANNEL, the Flatpak through its manifest.
  CHANNEL: ${{ inputs.release_tag == 'nightly' && 'nightly' || (startsWith(inputs.release_tag, 'v') && 'release' || 'dev') }}

jobs:
  # ------------------------------------------------------------------------------------------
  # Names, versions and the "is there an app to package at this commit" guard.
  # ------------------------------------------------------------------------------------------
  meta:
    name: Package metadata
    runs-on: ${{ contains(fromJSON(vars.VJ_TEMP_RUNNERS || '{"refs":[]}').refs, github.ref) && fromJSON(vars.VJ_TEMP_RUNNERS)['ubuntu-latest'] || 'ubuntu-latest' }}
    outputs:
      run: ${{ steps.m.outputs.run }}
      label: ${{ steps.m.outputs.label }}
      short_version: ${{ steps.m.outputs.short_version }}
      deb_version: ${{ steps.m.outputs.deb_version }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          run=true
          if [ ! -f app/CMakeLists.txt ]; then
            echo "::warning::no app/ at this commit (a core-only tag or branch): no app packages"
            run=false
          fi
          proj=""
          # app/CMakeLists.txt takes its version from CORE_BASE_VERSION in the Makefile.
          [ -f app/CMakeLists.txt ] && proj="$(sed -n 's/^CORE_BASE_VERSION[[:space:]]*:=[[:space:]]*v\{0,1\}\([0-9][0-9.]*\).*/\1/p' Makefile | head -1)"
          sha7="${GITHUB_SHA:0:7}"
          case "$TAG" in
            v[0-9]*)
              label="${TAG#v}"
              base="${label%%-*}"
              short="$base"
              if [ -n "$proj" ] && [ "$base" != "$proj" ]; then
                # The app must report the version in its file names.
                echo "::warning::tag $TAG does not match the app version $proj (CORE_BASE_VERSION in the Makefile): skipping app packages." \
                  "Bump CORE_BASE_VERSION in the release commit to ship them."
                run=false
              fi
              deb="$(printf '%s' "$label" | sed 's/-/~/')" ;;
            *)
              label="$TAG"; short="${proj:-0.0.0}"
              # Debian versions cannot be words: 3.8.1~nightly.<sha> sorts before 3.8.1.
              deb="${short}~${TAG//[^A-Za-z0-9]/}.${sha7}" ;;
          esac
          { echo "run=$run"; echo "label=$label"; echo "short_version=$short"; echo "deb_version=$deb"; } >> "$GITHUB_OUTPUT"
          echo "label=$label short=$short deb=$deb app_version=$proj run=$run"

  # ------------------------------------------------------------------------------------------
  # The librashader shader runtime, built FROM SOURCE (pinned, cached) for every package: Intel and
  # Apple silicon macOS, Linux x86_64 + aarch64, Windows x64 + arm64.  Upstream's x86_64-macos zip
  # holds an arm64 dylib, it publishes no Linux binary (#950), and its Windows DLLs import
  # D3DX9_43.dll + the VC++ redistributable, so they never loaded on a stock Windows (#1153).
  # Artifacts `librashader-<triple>` are intermediates; see .github/workflows/librashader.yml.
  # ------------------------------------------------------------------------------------------
  librashader:
    name: librashader runtime
    needs: [meta]
    if: needs.meta.outputs.run == 'true'
    uses: ./.github/workflows/librashader.yml

  # ------------------------------------------------------------------------------------------
  # Package-manager templates must always render and parse (they are filled for real, with the
  # release's checksums, by a maintainer after the release; see app/packaging/README.md).
  # ------------------------------------------------------------------------------------------
  manifests:
    name: Package-manager templates
    needs: [meta]
    if: needs.meta.outputs.run == 'true'
    runs-on: ${{ contains(fromJSON(vars.VJ_TEMP_RUNNERS || '{"refs":[]}').refs, github.ref) && fromJSON(vars.VJ_TEMP_RUNNERS)['ubuntu-latest'] || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Ensure the Ruby manifest validator is available
        run: |
          if ! command -v ruby >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ruby
          fi
      - name: Render with placeholder checksums and parse every output
        run: |
          set -eu
          v=1.2.3
          d="$RUNNER_TEMP/sums"; mkdir -p "$d"
          for f in macos-universal.zip windows-x64.zip windows-x64-setup.exe; do
            echo "$(printf '%s' "$f" | sha256sum | cut -d' ' -f1)  VirtualJaguar-$v-$f"
          done > "$d/SHA256SUMS.txt"
          bash app/packaging/manifests/render.sh --version "$v" --sums "$d/SHA256SUMS.txt" --out "$RUNNER_TEMP/manifests"
          cd "$RUNNER_TEMP/manifests"
          for formula in homebrew/*.rb; do ruby -c "$formula"; done
          python3 -c 'import json,sys; json.load(open("scoop/virtualjaguar.json"))'
          for y in winget/*.yaml flatpak/*.yml; do ruby -ryaml -rdate -e 'YAML.safe_load_file(ARGV[0], permitted_classes: [Date])' "$y"; echo "ok $y"; done

  # ------------------------------------------------------------------------------------------
  # macOS: universal .app (arm64 + x86_64), signed + notarized + stapled when the secrets exist
  # (every same-repo run; fork PRs never get the secrets and stay ad-hoc signed).
  # Two single-arch builds merged with lipo, not one multi-arch configure: each architecture is
  # handed its own librashader dylib (built from the same pinned source, librashader.yml).
  # ------------------------------------------------------------------------------------------
  macos:
    name: macOS universal
    needs: [meta, librashader]
    if: needs.meta.outputs.run == 'true'
    runs-on: macos-latest
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      SHORT_VERSION: ${{ needs.meta.outputs.short_version }}
      MIN_MACOS: '11.0'
    steps:
      - uses: actions/checkout@v7

      - name: Get the librashader runtimes (built from source, both architectures)
        uses: actions/download-artifact@v8
        with:
          pattern: librashader-*-apple-darwin
          path: librashader

      - name: Build both architectures
        run: |
          set -eu
          cat librashader/*/BUILD-INFO.txt
          for arch in arm64 x86_64; do
            case "$arch" in arm64) triple=aarch64-apple-darwin ;; *) triple=x86_64-apple-darwin ;; esac
            # An explicit runtime per architecture: nothing is downloaded, and the Intel slice is
            # a real x86_64 dylib (upstream's "x86_64" zip holds an arm64 one).
            cmake -S app -B "build-$arch" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="$arch" -DCMAKE_OSX_DEPLOYMENT_TARGET="$MIN_MACOS" \
              -DVJ_APP_FETCH_LIBRASHADER=OFF -DVJ_LIBRASHADER_LIB="$PWD/librashader/librashader-$triple/librashader.dylib" \
              -DVJ_PACKAGE_VERSION="$SHORT_VERSION" -DVJ_TV_DEFAULT="$TV_DEFAULT" -DVJ_BUILD_CHANNEL="$CHANNEL" \
              ${DISCORD_APP_ID:+-DVJ_DISCORD_APP_ID="$DISCORD_APP_ID"}
            cmake --build "build-$arch" --config Release -j4
            cmake --install "build-$arch" --prefix "$PWD/stage-$arch"
          done

      - name: Smoke tests (arm64 native; x86_64 under Rosetta when present)
        run: |
          set -eu
          # shaders_gl renders through the real librashader on a hidden GL context; on a GPU-less
          # runner it hangs until the 120 s timeout, so it is left to the developer machines.
          # The shader runtime must LOAD (the test fails, not skips, when it does not).
          export VJ_REQUIRE_LIBRASHADER=1
          ctest --test-dir build-arm64 -C Release --output-on-failure -E shaders_gl
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 build-x86_64/virtualjaguar --headless --frames 300 \
              --expect-hash "$SMOKE_HASH" "$SMOKE_ROM"
            # The Intel librashader, loaded and used to parse presets by an x86_64 process (Rosetta).
            file build-x86_64/vj_shader_tests | grep -q x86_64
            ctest --test-dir build-x86_64 -C Release --output-on-failure -R 'shaders_(unit|library|bundled)'
          else
            echo "::warning::Rosetta is not available on this runner: the x86_64 slice was built but not run"
          fi

      - name: Assemble the universal app
        run: |
          set -eu
          P=app/packaging/macos
          bash $P/make-universal.sh stage-arm64 stage-x86_64 stage-universal
          bash $P/make-app.sh stage-universal "dist/Virtual Jaguar.app" "$SHORT_VERSION" "${GITHUB_RUN_NUMBER}" "$MIN_MACOS"
          bash $P/check-universal.sh "dist/Virtual Jaguar.app" "$MIN_MACOS"
          for d in cheats libretro-db shaders; do
            if [ -d "build-arm64/$d" ]; then
              test -d "dist/Virtual Jaguar.app/Contents/Resources/$d" || { echo "::error::$d/ missing from the bundle"; exit 1; }
            fi
          done

      - name: Smoke-test the BUNDLE
        run: |
          set -eu
          app="$PWD/dist/Virtual Jaguar.app"
          t="$(mktemp -d)"; cp -R "$app" "$t/"
          exe="$t/Virtual Jaguar.app/Contents/MacOS/virtualjaguar"
          "$exe" --headless --frames 300 --expect-hash "$SMOKE_HASH" "$SMOKE_ROM"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$exe" --headless --frames 300 --expect-hash "$SMOKE_HASH" "$SMOKE_ROM"
          fi
          # The universal librashader inside the bundle: both slices, each loaded by a process of its own
          # architecture (the arm64 one natively, the x86_64 one under Rosetta).
          lib="$t/Virtual Jaguar.app/Contents/Frameworks/librashader.dylib"
          lipo -info "$lib"
          [ "$(lipo -archs "$lib" | tr ' ' '\n' | sort | tr '\n' ' ')" = "arm64 x86_64 " ]
          export VJ_REQUIRE_LIBRASHADER=1
          VJ_LIBRASHADER="$lib" build-arm64/vj_shader_tests library
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            VJ_LIBRASHADER="$lib" build-x86_64/vj_shader_tests library
          fi
          rm -rf "$t"
          # The app looks for its bundled data beside SDL_GetBasePath(), which for a .app is
          # Contents/Resources (headless mode uses a temp data dir, so this is checked in the SDL source
          # that was built, to catch a future SDL bump changing it).
          grep -q 'resourcePath' build-arm64/_deps/sdl3-src/src/filesystem/cocoa/SDL_sysfilesystem.m

      # The composite action (.github/actions/macos-sign) imports the certificate into a temporary
      # keychain, signs inside-out, notarizes, staples the .app and deletes the keychain again.
      # Without the APPLE_* secrets (fork PRs) it only prints a warning and signs nothing.
      - name: Developer ID sign, notarize and staple the app
        id: devid
        if: inputs.sign
        uses: ./.github/actions/macos-sign
        with:
          paths: dist/Virtual Jaguar.app
          notarize: 'true'
          apple-developer-id-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-notary-key-id: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          apple-notary-issuer-id: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          apple-notary-key-p8-base64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}

      # Apple Silicon refuses an unsigned binary ("damaged"), so a build that was not Developer ID
      # signed still gets an ad-hoc signature.  Gatekeeper still refuses it until right-click > Open.
      - name: Ad-hoc sign the app (no Developer ID signature)
        if: steps.devid.outputs.signed != 'true'
        run: |
          set -eu
          echo "::warning::macOS package is NOT Developer ID signed or notarized" \
            "(signing not requested here, or the APPLE_* secrets are missing)." \
            "It is ad-hoc signed; Gatekeeper refuses it until right-click > Open."
          bash app/packaging/macos/codesign.sh sign-app "dist/Virtual Jaguar.app" adhoc

      - name: Make the zip (the only macOS package) and check what it unpacks to
        run: |
          set -eu
          mkdir -p out
          zip="out/VirtualJaguar-${LABEL}-macos-universal.zip"
          # The app inside is signed, notarized and stapled already; ditto keeps all of it.
          ditto -c -k --sequesterRsrc --keepParent "dist/Virtual Jaguar.app" "$zip"
          t="$(mktemp -d)"
          ditto -x -k "$zip" "$t"
          find "$t" -mindepth 1 -maxdepth 1
          test -d "$t/Virtual Jaguar.app"   # the .app is the zip's only top-level entry
          [ "$(find "$t" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 1 ]
          codesign --verify --deep --strict "$t/Virtual Jaguar.app"
          if [ "${{ steps.devid.outputs.notarized }}" = "true" ]; then
            xcrun stapler validate "$t/Virtual Jaguar.app"
            spctl -a -t exec -vv "$t/Virtual Jaguar.app"
          fi
          rm -rf "$t"
          ls -la out

      # What the gate cannot re-derive from the zip on its own: whether Apple issued the ticket.
      - name: Record the signing outcome for the release gate
        run: bash scripts/release/signing-status.sh "VirtualJaguar-${LABEL}-macos-universal.zip" "${{ steps.devid.outputs.signed || 'false' }}" "${{ steps.devid.outputs.notarized || 'false' }}" developer-id signing-status
      - uses: actions/upload-artifact@v7
        with:
          name: signing-status-app-macos
          path: signing-status/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: app-package-macos-universal
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------------------------
  # Windows x64 (MinGW-w64, the core's own Windows toolchain) and Windows ARM64 (the same MinGW-w64
  # environment in its CLANGARM64 flavour: clang + libc++ + lld on a native windows-11-arm runner):
  # portable zip + Inno Setup installer each, every PE file Authenticode-signed (#1150).  Three
  # stages per architecture:
  #
  #   windows          build, test, install tree -> intermediate artifact windows-stage-<arch>
  #   windows-package  ONE x64 job for both architectures: sign every exe/dll in both trees with
  #                    Azure Artifact Signing (.github/actions/windows-sign), build the portable
  #                    zips and the Inno Setup installers, sign the installers, verify, upload
  #                    app-package-windows-<arch>.  Not done in the build job because the signing
  #                    action runs on x64 runners only ("We currently do not support Windows Arm
  #                    runners", Azure/artifact-signing-action; its signing dlib ships x64/x86).
  #   windows-smoke    the FINAL packages on each architecture's native runner: Authenticode
  #                    re-checked on the DOWNLOADED artifact, portable zip run, silent
  #                    install / run / uninstall.
  # ------------------------------------------------------------------------------------------
  windows:
    name: Windows ${{ matrix.arch }}
    needs: [meta, librashader]
    if: needs.meta.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    # Both legs are required (the arm64 continue-on-error of v3.8.1 went with #1153: a red arm64
    # package now holds the release like every other asset).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            msystem: MINGW64
            triple: x86_64-pc-windows-msvc
            pkgs: >-
              zip
              mingw-w64-x86_64-gcc
              mingw-w64-x86_64-cmake
              mingw-w64-x86_64-ninja
              mingw-w64-x86_64-mesa
              mingw-w64-x86_64-python
            cmake_extra: ''
          - arch: arm64
            os: windows-11-arm
            msystem: CLANGARM64
            triple: aarch64-pc-windows-msvc
            pkgs: >-
              zip
              mingw-w64-clang-aarch64-clang
              mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-ninja
              mingw-w64-clang-aarch64-mesa
              mingw-w64-clang-aarch64-python
            cmake_extra: '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++'
    defaults:
      run:
        shell: 'msys2 {0}'
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      SHORT_VERSION: ${{ needs.meta.outputs.short_version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      # The shader runtime, built from the pinned source for this CPU (librashader.yml; the MSVC-target
      # DLL loads into the MinGW-built exe through the plain C ABI).  Lands beside the executable, in
      # the portable zip and in the installer.
      - name: Get the librashader runtime (built from source)
        uses: actions/download-artifact@v8
        with:
          name: librashader-${{ matrix.triple }}
          path: librashader

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.pkgs }}

      - name: Configure and build (GUI subsystem, static runtime)
        run: |
          set -eu
          cat librashader/BUILD-INFO.txt
          cmake -S app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVJ_APP_WIN32_GUI=ON -DVJ_PACKAGE_VERSION="$SHORT_VERSION" -DVJ_TV_DEFAULT="$TV_DEFAULT" -DVJ_BUILD_CHANNEL="$CHANNEL" \
            -DVJ_APP_FETCH_LIBRASHADER=OFF -DVJ_LIBRASHADER_LIB="$(cygpath -m "$PWD")/librashader/librashader.dll" \
            ${DISCORD_APP_ID:+-DVJ_DISCORD_APP_ID="$DISCORD_APP_ID"} \
            ${{ matrix.cmake_extra }}
          grep -E 'librashader|CMAKE_SYSTEM_PROCESSOR|CMAKE_C_COMPILER:' build/CMakeCache.txt | head
          cmake --build build -j4

      # Exactly one blitter_simd_ops (NEON on ARM64, SSE2 on x64), see app.yml.
      - name: Exactly one SIMD vtable in the core library
        run: |
          set -eu
          lib=$(find build -name 'libvj_core.a' | head -1)
          [ -n "$lib" ] || { echo "libvj_core.a not found"; exit 1; }
          NM="$(command -v nm || command -v llvm-nm)"; echo "nm: $NM"
          n=$("$NM" "$lib" 2>/dev/null | grep -cE ' [A-Z] _?blitter_simd_ops$' || true)
          echo "blitter_simd_ops definitions: $n"
          [ "$n" -eq 1 ] || { echo "::error::expected exactly 1 blitter_simd_ops, found $n"; exit 1; }

      # The runtime must load here (shaders_library FAILS instead of skipping: VJ_REQUIRE_LIBRASHADER,
      # #1153; on the v3.11.0 tag it skipped on both legs because upstream's DLL could not be loaded).
      # shaders_gl needs an OpenGL 3.3 context, which the hosted runners' GDI driver does not give;
      # Windows GL rendering is qualified by windows-gl-test.yml (#1155).
      - name: Smoke tests (GUI-subsystem exe, output through pipes)
        run: VJ_REQUIRE_LIBRASHADER=1 ctest --test-dir build --output-on-failure -E shaders_gl

      - name: The shader runtime beside the executable loads (ABI 2) and parses the bundled presets
        run: |
          set -eu
          test -f build/librashader.dll
          python app/packaging/windows/check-librashader-dll.py build/librashader.dll --arch "$ARCH" --require-load
          VJ_REQUIRE_LIBRASHADER=1 VJ_LIBRASHADER="$(cygpath -m "$PWD/build/librashader.dll")" build/vj_shader_tests.exe library

      - name: The exe must import only Windows system DLLs
        run: |
          set -eu
          OBJDUMP="$(command -v objdump || command -v llvm-objdump)"
          echo "objdump: $OBJDUMP"
          "$OBJDUMP" -p build/virtualjaguar.exe | awk '/DLL Name/ {print $3}' | sort -u | tee dlls.txt
          [ -s dlls.txt ] || { echo "::error::no import table found (objdump output not understood)"; exit 1; }
          if grep -qiE 'libstdc|libgcc|libwinpthread|libc\+\+|libunwind|SDL3|libcurl' dlls.txt; then
            echo "::error::virtualjaguar.exe depends on a non-system DLL (static runtime not in effect)"; exit 1
          fi
          # GUI subsystem = 2 (console = 3)
          "$OBJDUMP" -p build/virtualjaguar.exe | grep -i 'Subsystem' | tee subsystem.txt
          grep -qiE 'windows GUI|Subsystem[[:space:]]+0*2([^0-9]|$)' subsystem.txt || { echo "::error::not a GUI-subsystem executable"; exit 1; }
          # The machine type must match the leg (a mis-targeted toolchain would still link).
          "$OBJDUMP" -f build/virtualjaguar.exe | tee machine.txt
          if [ "$ARCH" = arm64 ]; then grep -qiE 'aarch64|arm64' machine.txt; else grep -qiE 'x86-64|i386:x86-64' machine.txt; fi

      # The install sweep must carry every data directory the build staged (the smoke job later
      # checks the PACKAGES against this tree).  stage-tests/ carries the shader test binary the
      # smoke job runs against the packaged DLL; it is not part of the install prefix.
      - name: Install tree
        run: |
          set -eu
          cmake --install build --prefix "$PWD/stage"
          python app/packaging/windows/stage-software-gl.py stage
          bash app/packaging/check-payload.sh build stage/bin virtualjaguar.exe
          mkdir -p stage-tests && cp build/vj_shader_tests.exe stage-tests/
          find stage -type f \( -iname '*.exe' -o -iname '*.dll' \) | LC_ALL=C sort | sed 's/^/PE: /'

      # Intermediate (never a release asset: scripts/release/stage.sh skips windows-stage-*).
      - name: Upload the unsigned install tree
        uses: actions/upload-artifact@v7
        with:
          name: windows-stage-${{ matrix.arch }}
          path: |
            stage
            stage-tests
          if-no-files-found: error
          retention-days: 3

  # ------------------------------------------------------------------------------------------
  # Sign and package both Windows architectures (#1150).  One x64 job: the Azure signing action
  # does not run on Windows ARM runners, and Authenticode does not care which CPU a PE image is
  # for.  Signing runs when the caller asks (`sign`) and the three AZURE_* secrets plus the three
  # AZURE_SIGNING_* variables exist; otherwise the composite action prints a notice and the
  # packages are built unsigned, exactly as before (fork PRs, dispatches without `sign`, and every
  # run until the maintainer finishes the Azure setup in app/packaging/README.md).
  #
  # What gets signed, in order: every exe and dll in both install trees -- virtualjaguar.exe,
  # librashader.dll, the software-opengl/ fallback copy of the app and the bundled Mesa DLLs
  # (MSYS2's MIT-licensed build, unsigned upstream: we are the publisher of the package they ship
  # in, nothing in them checks its own signature, and the release gate scans every PE file in
  # the zip; roughly ten signatures per architecture of the Basic tier's 5,000/month) -- then,
  # once Inno Setup has packed the signed tree, the two installers.  The uninstaller Inno embeds
  # (unins000.exe) is not signed: Inno's SignTool hook needs a command-line signer, which the
  # action's PowerShell module is not.
  # ------------------------------------------------------------------------------------------
  windows-package:
    name: Windows sign and package
    needs: [meta, windows]
    if: needs.meta.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write   # azure/login OIDC (no client secret); harmless when signing is skipped
    defaults:
      run:
        shell: 'msys2 {0}'
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      SIGN: ${{ inputs.sign }}
    outputs:
      signed: ${{ steps.sign-tree.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2 (zip for the portable packages)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: zip

      - name: Get both install trees
        uses: actions/download-artifact@v8
        with:
          pattern: windows-stage-*
          path: pkg

      - name: Check the trees
        run: |
          set -eu
          rm -rf pkg/*/stage-tests   # the smoke jobs fetch their own copy; nothing to sign there
          for a in x64 arm64; do
            test -f "pkg/windows-stage-$a/stage/bin/virtualjaguar.exe"
            test -f "pkg/windows-stage-$a/stage/bin/librashader.dll"
            test -f "pkg/windows-stage-$a/stage/bin/software-opengl/opengl32.dll"
          done
          find pkg -type f \( -iname '*.exe' -o -iname '*.dll' \) | LC_ALL=C sort | sed 's/^/to sign: /'

      - name: Sign every PE file in both install trees (Azure Artifact Signing)
        id: sign-tree
        uses: ./.github/actions/windows-sign
        with:
          files-folder: ${{ github.workspace }}\pkg
          files-folder-recurse: 'true'
          description: Virtual Jaguar ${{ needs.meta.outputs.label }}
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}

      - name: Install Inno Setup (pinned, digest-verified)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
            $sha = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\innosetup.exe"
            if ((Get-FileHash "$env:RUNNER_TEMP\innosetup.exe" -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw "Inno Setup digest mismatch" }
            Start-Process "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          "Inno Setup: $iscc"

      # The same package.sh and virtualjaguar.iss serve both architectures (--arch, /DArm64); the
      # arm64 installer only needs ISCC, which is an x86 program wherever it runs.
      - name: Package (portable zip + installer), both architectures
        run: |
          set -eu
          for a in x64 arm64; do
            bash app/packaging/windows/package.sh "pkg/windows-stage-$a/stage" "$LABEL" out --arch "$a" \
              --installer "/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          done
          ls -l out/ | sed 's/^/package: /'

      - name: Sign the installers (Azure Artifact Signing)
        id: sign-setup
        uses: ./.github/actions/windows-sign
        with:
          files: |
            ${{ github.workspace }}\out\VirtualJaguar-${{ needs.meta.outputs.label }}-windows-x64-setup.exe
            ${{ github.workspace }}\out\VirtualJaguar-${{ needs.meta.outputs.label }}-windows-arm64-setup.exe
          description: Virtual Jaguar ${{ needs.meta.outputs.label }} Setup
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}

      # The shipped files, as shipped: every PE file inside both zips and both installers must be
      # validly signed and timestamped when signing ran (the job fails otherwise); a report only
      # when it did not.
      - name: Authenticode on the final packages
        shell: pwsh
        env:
          SIGNED: ${{ steps.sign-tree.outputs.signed == 'true' && steps.sign-setup.outputs.signed == 'true' }}
        run: |
          $expect = if ($env:SIGNED -eq 'true') { 'signed' } else { 'report' }
          $files = @(Get-ChildItem out -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*-setup.exe' } | ForEach-Object { $_.FullName })
          & app/packaging/windows/verify-signatures.ps1 -Expect $expect -Path $files -Title "Authenticode on the final Windows packages ($expect)"
          exit $LASTEXITCODE

      - name: Warn when unsigned
        if: steps.sign-tree.outputs.signed != 'true'
        run: echo "::warning::Windows binaries are NOT code signed (Azure Artifact Signing not configured or sign not requested). SmartScreen will warn on first run."

      # The gate re-derives Authenticode from the files; the sidecar records what this job did.
      - name: Record the signing outcome for the release gate
        env:
          SIGNED: ${{ steps.sign-tree.outputs.signed == 'true' && steps.sign-setup.outputs.signed == 'true' }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          set -eu
          method=none; detail="AZURE_* secrets/variables not configured or sign not requested"
          if [ "$SIGNED" = true ]; then method=azure-artifact-signing; detail="Azure Artifact Signing, account $ACCOUNT, profile $PROFILE"; fi
          for a in x64 arm64; do
            for f in "VirtualJaguar-${LABEL}-windows-${a}.zip" "VirtualJaguar-${LABEL}-windows-${a}-setup.exe"; do
              test -f "out/$f"
              bash scripts/release/signing-status.sh "$f" "$SIGNED" false "$method" signing-status "$detail"
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: signing-status-app-windows
          path: signing-status/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: app-package-windows-x64
          path: out/*-windows-x64*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: app-package-windows-arm64
          path: out/*-windows-arm64*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------------------------
  # Smoke-test the FINAL Windows packages on each architecture's own runner, from the uploaded
  # artifacts: the signature check from the downloaded files (an in-job check proves nothing
  # about what was uploaded), the portable zip, and the installer (silent install, run, silent
  # uninstall).  The reference install tree is only used for the payload comparison and the
  # shader test binary.
  # ------------------------------------------------------------------------------------------
  windows-smoke:
    name: Windows smoke ${{ matrix.arch }}
    needs: [meta, windows-package]
    if: needs.meta.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            msystem: MINGW64
            pkgs: unzip mingw-w64-x86_64-python
          - arch: arm64
            os: windows-11-arm
            msystem: CLANGARM64
            pkgs: unzip mingw-w64-clang-aarch64-python
    defaults:
      run:
        shell: 'msys2 {0}'
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      ARCH: ${{ matrix.arch }}
      SIGNED: ${{ needs.windows-package.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.pkgs }}

      - name: Get the packages
        uses: actions/download-artifact@v8
        with:
          name: app-package-windows-${{ matrix.arch }}
          path: out

      - name: Get the reference install tree
        uses: actions/download-artifact@v8
        with:
          name: windows-stage-${{ matrix.arch }}
          path: ref

      - name: Authenticode on the downloaded packages
        shell: pwsh
        run: |
          $expect = if ($env:SIGNED -eq 'true') { 'signed' } else { 'report' }
          $files = @(Get-ChildItem out -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*-setup.exe' } | ForEach-Object { $_.FullName })
          & app/packaging/windows/verify-signatures.ps1 -Expect $expect -Path $files -Title "Authenticode on the downloaded windows-$env:ARCH packages ($expect)"
          exit $LASTEXITCODE

      - name: Smoke-test the PORTABLE zip
        run: |
          set -eu
          ls -l out/ | sed 's/^/package: /'
          t="$RUNNER_TEMP/portable"; rm -rf "$t"; mkdir -p "$t"
          unzip -q "out/VirtualJaguar-${LABEL}-windows-${ARCH}.zip" -d "$t"
          cd "$t/VirtualJaguar"
          ./virtualjaguar.exe --headless --frames 300 --expect-hash "$SMOKE_HASH" "$GITHUB_WORKSPACE/$SMOKE_ROM"
          test -f portable.txt   # --headless uses a temp data dir, so portable mode itself cannot be observed here
          cd "$GITHUB_WORKSPACE"
          bash app/packaging/check-payload.sh ref/stage/bin "$t/VirtualJaguar" virtualjaguar.exe
          # The shader runtime in the zip: right CPU, Windows-only imports, loads with ABI 2, and the
          # app's own lookup (beside the executable, VJ_LIBRASHADER unset) finds it (#1153).
          bash app/packaging/windows/check-librashader.sh "$t/VirtualJaguar" "$ARCH" ref/stage-tests/vj_shader_tests.exe

      - name: Smoke-test the INSTALLER (silent install, run, silent uninstall)
        run: |
          set -eu
          export MSYS2_ARG_CONV_EXCL='*'
          dir='C:\vjtest'
          "out/VirtualJaguar-${LABEL}-windows-${ARCH}-setup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER "/DIR=$dir" "/LOG=$(cygpath -w "$RUNNER_TEMP/inno.log")"
          ls /c/vjtest
          test -f /c/vjtest/virtualjaguar.exe
          test ! -f /c/vjtest/portable.txt || { echo "::error::installer must not ship portable.txt"; exit 1; }
          /c/vjtest/virtualjaguar.exe --headless --frames 300 --expect-hash "$SMOKE_HASH" "$GITHUB_WORKSPACE/$SMOKE_ROM"
          bash app/packaging/check-payload.sh ref/stage/bin /c/vjtest virtualjaguar.exe
          du -sk /c/vjtest | sed 's/^/installed tree KiB: /'
          bash app/packaging/windows/check-librashader.sh /c/vjtest "$ARCH" ref/stage-tests/vj_shader_tests.exe
          /c/vjtest/unins000.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          sleep 5
          test ! -f /c/vjtest/virtualjaguar.exe || { echo "::error::uninstall left the program behind"; exit 1; }

  # ------------------------------------------------------------------------------------------
  # Flatpak (x86_64 and aarch64, #1156): one self-contained .flatpak bundle per CPU (the runtime
  # comes from Flathub when the user installs it).  Built OFFLINE from app/packaging/flatpak/*.yml,
  # whose every dependency is a hash-pinned manifest source, inside the Flathub CI image for the
  # manifest's runtime.  Both legs build NATIVELY: the image is multi-arch (amd64 + arm64) and the
  # aarch64 leg runs on GitHub's hosted ubuntu-24.04-arm runner, so the Rust librashader module is
  # compiled by the aarch64 Rust SDK extension, not under QEMU user-mode emulation.  Never
  # submitted to Flathub from here.
  # ------------------------------------------------------------------------------------------
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [meta]
    if: needs.meta.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            artifact: app-package-flatpak
          - arch: aarch64
            os: ubuntu-24.04-arm
            artifact: app-package-flatpak-aarch64
    # Non-blocking since v3.8.1 (the Windows arm64 leg lost its continue-on-error with #1153; both
    # Flatpak legs keep it: the Flathub image and the hosted arm runner are outside our control).
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      ARCH: ${{ matrix.arch }}
      APP_ID: io.github.libretro.VirtualJaguar
    steps:
      - uses: actions/checkout@v7

      - name: Set the TV mode default and the build channel in the manifest
        # The manifest itself stays on CMake's default (Auto); a release package gets Manual here, like the other packages.
        run: |
          set -eu
          sed -i "s|- -DVJ_APP_BUILD_TESTS=OFF|&\n      - -DVJ_TV_DEFAULT=$TV_DEFAULT|" app/packaging/flatpak/io.github.libretro.VirtualJaguar.yml
          # Fail here, not silently, if the sed did not match (the manifest's config-opts changed).
          grep -qx "      - -DVJ_TV_DEFAULT=$TV_DEFAULT" app/packaging/flatpak/io.github.libretro.VirtualJaguar.yml
          sed -i "s|^\(      - -DVJ_BUILD_CHANNEL=\)release$|\1$CHANNEL|" app/packaging/flatpak/io.github.libretro.VirtualJaguar.yml
          grep -qx "      - -DVJ_BUILD_CHANNEL=$CHANNEL" app/packaging/flatpak/io.github.libretro.VirtualJaguar.yml

      - name: Note the start time and the host
        id: t0
        run: |
          set -eu
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          # The leg must be native: an emulated build would be a silent order-of-magnitude slowdown.
          echo "host: $(uname -m), $(nproc) CPUs, $(sed -n 's/^PRETTY_NAME=//p' /etc/os-release)"
          test "$(uname -m)" = "$ARCH" || { echo "::error::runner is $(uname -m), expected a native $ARCH host"; exit 1; }

      - name: Look up the flatpak-builder cache (for the job summary only)
        # The same lookup the action makes inside the build step (its primary key is <cache-key>-<arch>,
        # its fallback the prefix flatpak-builder-<arch>), without restoring anything: the summary can
        # then say whether the wall time below is a cold or a warm figure.  File mtimes cannot tell
        # (extracted sources keep their archive dates, so a cold aarch64 run once read "warm").
        id: cachelookup
        uses: actions/cache/restore@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('app/packaging/flatpak/*.yml', 'app/packaging/flatpak/*.json', 'app/CMakeLists.txt', 'app/cmake/**') }}-${{ matrix.arch }}
          restore-keys: flatpak-builder-${{ matrix.arch }}
          lookup-only: true

      - name: Build the bundle
        # flatpak/flatpak-github-actions v6.8 (pinned by commit).  upload-artifact is OFF: its
        # own artifact would be named app-<arch>.flatpak and not app-package-*, and the release
        # jobs attach every artifact they find; the final file is uploaded below.
        id: build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          bundle: VirtualJaguar-${{ needs.meta.outputs.label }}-linux-${{ matrix.arch }}.flatpak
          manifest-path: app/packaging/flatpak/io.github.libretro.VirtualJaguar.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('app/packaging/flatpak/*.yml', 'app/packaging/flatpak/*.json', 'app/CMakeLists.txt', 'app/cmake/**') }}
          upload-artifact: false

      - name: Record the build time in the job summary (#1156)
        # Per leg, success or failure.  "cold" = no flatpak-builder cache existed for this leg (the
        # from-scratch figure the issue asks for); "warm" = the action restored the exact key, so the
        # app module and much of the Rust build came from cache; "partial" = an older key matched.
        if: always() && steps.t0.outcome == 'success'
        env:
          START: ${{ steps.t0.outputs.start }}
          OUTCOME: ${{ steps.build.outcome }}
          RUNNER: ${{ matrix.os }}
          CACHE_HIT: ${{ steps.cachelookup.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.cachelookup.outputs.cache-matched-key }}
        run: |
          set -eu
          secs=$(( $(date +%s) - START ))
          if [ "$CACHE_HIT" = true ]; then cache="warm (\`$CACHE_KEY\`)"
          elif [ -n "$CACHE_KEY" ]; then cache="partial (\`$CACHE_KEY\`)"
          else cache=cold; fi
          {
            echo "### Flatpak $ARCH"
            echo
            echo "| Leg | Runner | flatpak-builder cache | Build | Wall time |"
            echo "|---|---|---|---|---|"
            echo "| \`$ARCH\` | \`$RUNNER\` (native $(uname -m), $(nproc) CPUs) | $cache | $OUTCOME | $((secs / 60)) min $((secs % 60)) s |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "flatpak $ARCH: build $OUTCOME in ${secs}s (cache $cache)"

      - name: Smoke-test the bundle (install, run headless against the public ROM)
        run: |
          set -eu
          f="VirtualJaguar-${LABEL}-linux-${ARCH}.flatpak"
          ls -la "$f"
          flatpak install --user -y --noninteractive "./$f"
          flatpak info --user "$APP_ID"
          # The bundle must be for this leg's CPU (a cross-labelled bundle would still install here).
          flatpak info --user "$APP_ID" | grep -E "^[[:space:]]*Arch:[[:space:]]+$ARCH\$"
          # The sandbox only sees the repository because it is passed in here, read-only.
          flatpak run --user --filesystem="$GITHUB_WORKSPACE:ro" "$APP_ID" \
            --headless --frames 300 --expect-hash "$SMOKE_HASH" "$GITHUB_WORKSPACE/$SMOKE_ROM"
          # The bundled data must be beside the executable inside the sandbox.
          flatpak run --user --command=sh "$APP_ID" -c \
            'ls /app/bin/cheats | head -3 && ls "/app/bin/libretro-db" && test -d /app/bin/shaders/slang-shaders && ls /app/share/metainfo'
          # The shader runtime (#951): librashader.so must be in /app/lib, resolve all its libraries and
          # speak the ABI the app was built against (LIBRASHADER_CURRENT_ABI 2).  The app finds it through
          # LD_LIBRARY_PATH=/app/lib, so load it by bare name exactly as src/shaders.cpp does.  Same check
          # on both legs: on aarch64 it proves the Rust module cross-built nothing and loads natively.
          flatpak run --user --command=sh "$APP_ID" -c \
            'ls -l /app/lib/librashader.so && ls /app/share/licenses/io.github.libretro.VirtualJaguar && ! ldd /app/lib/librashader.so | grep "not found"'
          flatpak run --user --env=VJ_EXPECT_ARCH="$ARCH" --command=python3 "$APP_ID" -c \
            'import ctypes, os, platform; m = platform.machine(); print("sandbox", m); assert m == os.environ["VJ_EXPECT_ARCH"], m; l = ctypes.CDLL("librashader.so"); a = l.libra_instance_abi_version(); print("librashader ABI", a); assert a == 2, a' \
            || { echo "::error::librashader ABI check failed on $ARCH"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: VirtualJaguar-${{ needs.meta.outputs.label }}-linux-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------------------------
  # Linux: AppImage + .deb on x86_64 and aarch64.  Built on Ubuntu 22.04 (glibc 2.35), the oldest
  # runner image, so the packages run on anything from Debian 12 / Ubuntu 22.04 up.
  # ------------------------------------------------------------------------------------------
  linux:
    name: Linux ${{ matrix.arch }}
    needs: [meta, librashader]
    if: needs.meta.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            debarch: amd64
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - arch: aarch64
            debarch: arm64
            os: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      SHORT_VERSION: ${{ needs.meta.outputs.short_version }}
      DEB_VERSION: ${{ needs.meta.outputs.deb_version }}
    steps:
      - uses: actions/checkout@v7

      # Upstream publishes no Linux librashader: this is built from the pinned source on this same
      # image (glibc 2.35), see librashader.yml.  It lands beside the executable and in both packages.
      - name: Get the librashader runtime (built from source)
        uses: actions/download-artifact@v8
        with:
          name: librashader-${{ matrix.triple }}
          path: librashader

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake pkg-config curl dpkg-dev desktop-file-utils appstream \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libcurl4-openssl-dev

      - name: Build
        run: |
          set -eu
          cat librashader/BUILD-INFO.txt
          cmake -S app -B build -DCMAKE_BUILD_TYPE=Release -DVJ_PACKAGE_VERSION="$SHORT_VERSION" -DVJ_TV_DEFAULT="$TV_DEFAULT" -DVJ_BUILD_CHANNEL="$CHANNEL" \
            -DVJ_LIBRASHADER_LIB="$PWD/librashader/librashader.so" \
            ${DISCORD_APP_ID:+-DVJ_DISCORD_APP_ID="$DISCORD_APP_ID"}
          cmake --build build -j"$(nproc)"
          # The runtime must load here (the test fails, not skips).  shaders_gl needs a GL context,
          # which a display-less runner does not have.
          VJ_REQUIRE_LIBRASHADER=1 ctest --test-dir build --output-on-failure -E shaders_gl

      - name: Validate the desktop file and appstream metadata
        run: |
          set -eu
          cmake --install build --prefix "$RUNNER_TEMP/inst"
          desktop-file-validate "$RUNNER_TEMP"/inst/share/applications/*.desktop
          # Fail on errors only: warnings and infos differ between appstream versions.
          appstreamcli validate --no-net "$RUNNER_TEMP"/inst/share/metainfo/*.metainfo.xml | tee "$RUNNER_TEMP/appstream.txt" || true
          if grep -q '^E:' "$RUNNER_TEMP/appstream.txt"; then echo "::error::appstream metadata has errors"; exit 1; fi

      # The AppImage signing key (#1151).  With the `sign` input and the APPIMAGE_GPG_PRIVATE_KEY
      # secret, the armored private key goes into a throwaway GNUPGHOME and make-appimage.sh passes
      # `--sign --sign-key <fingerprint>` to appimagetool, which signs through gpgme and takes the
      # passphrase from APPIMAGETOOL_SIGN_PASSPHRASE (loopback pinentry).  Without the secret the
      # AppImage is built unsigned, as before, and the log says so.
      - name: Import the AppImage signing key
        id: gpgkey
        if: inputs.sign
        env:
          APPIMAGE_GPG_PRIVATE_KEY: ${{ secrets.APPIMAGE_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "$APPIMAGE_GPG_PRIVATE_KEY" ]; then
            echo "::warning::AppImage is NOT signed: the APPIMAGE_GPG_PRIVATE_KEY secret is not configured (app/packaging/README.md, Signed AppImages)."
            echo "fingerprint=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          printf '%s\n' "$APPIMAGE_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')
          [ -n "$fpr" ] || { echo "::error::APPIMAGE_GPG_PRIVATE_KEY did not import a secret key"; exit 1; }
          # The committed public key must be this key, or every AppImage would fail the gate.
          if [ -f docs/release-signing-appimage.asc ]; then
            pub=$(gpg --batch --with-colons --import-options show-only --import docs/release-signing-appimage.asc | awk -F: '$1=="fpr"{print $10}')
            case " $pub " in *" $fpr "*) ;; *) echo "::error::the APPIMAGE_GPG_PRIVATE_KEY secret ($fpr) is not the key committed as docs/release-signing-appimage.asc ($pub)"; exit 1 ;; esac
          else
            echo "::warning::docs/release-signing-appimage.asc is not committed; the gate cannot require AppImage signatures until it is."
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "fingerprint=$fpr" >> "$GITHUB_OUTPUT"
          echo "AppImage signing key: $fpr"

      - name: Package
        env:
          VJ_APPIMAGE_SIGN_KEY: ${{ steps.gpgkey.outputs.fingerprint }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.APPIMAGE_GPG_PASSPHRASE }}
        run: |
          set -eu
          mkdir -p out
          bash app/packaging/linux/make-appimage.sh build "out/VirtualJaguar-${LABEL}-linux-${{ matrix.arch }}.AppImage" "${{ matrix.arch }}"
          bash app/packaging/linux/make-deb.sh build "out/virtualjaguar_${LABEL}_${{ matrix.debarch }}.deb" "${{ matrix.debarch }}" "$DEB_VERSION"

      - name: Record the signing outcome for the release gate
        env:
          FPR: ${{ steps.gpgkey.outputs.fingerprint }}
        run: |
          set -eu
          f="VirtualJaguar-${LABEL}-linux-${{ matrix.arch }}.AppImage"
          if [ -n "$FPR" ]; then
            python3 app/packaging/linux/verify-appimage.py "out/$f" ${{ hashFiles('docs/release-signing-appimage.asc') != '' && '--pubkey docs/release-signing-appimage.asc' || '' }}
            bash scripts/release/signing-status.sh "$f" true false gpg signing-status "$FPR"
          else
            bash scripts/release/signing-status.sh "$f" false false none signing-status "APPIMAGE_GPG_PRIVATE_KEY not configured or sign not requested"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: signing-status-app-linux-${{ matrix.arch }}
          path: signing-status/
          retention-days: 14

      - name: Smoke-test the AppImage
        run: |
          set -eu
          f="out/VirtualJaguar-${LABEL}-linux-${{ matrix.arch }}.AppImage"
          export APPIMAGE_EXTRACT_AND_RUN=1
          "./$f" --headless --frames 300 --expect-hash "$SMOKE_HASH" "$SMOKE_ROM"
          # Where is the payload?  Extract and compare with the build tree.
          "./$f" --appimage-extract >/dev/null
          bash app/packaging/check-payload.sh build squashfs-root/usr/bin virtualjaguar
          ldd squashfs-root/usr/bin/virtualjaguar | tee ldd.txt
          if grep -q 'not found' ldd.txt; then echo "::error::unresolved libraries in the AppImage"; exit 1; fi
          # The shader runtime is in the AppImage, is the right architecture, resolves, and is
          # found by the app's own search (beside the executable, VJ_LIBRASHADER unset).
          bash app/packaging/linux/check-librashader.sh squashfs-root/usr/bin "${{ matrix.arch }}" build/vj_shader_tests
          rm -rf squashfs-root

      - name: Smoke-test the .deb (install, run through /usr/bin, check payload, remove)
        run: |
          set -eu
          f="out/virtualjaguar_${LABEL}_${{ matrix.debarch }}.deb"
          sudo apt-get install -y -qq --no-install-recommends "./$f"
          test -L /usr/bin/virtualjaguar
          virtualjaguar --headless --frames 300 --expect-hash "$SMOKE_HASH" "$SMOKE_ROM"
          bash app/packaging/check-payload.sh build /usr/lib/virtualjaguar virtualjaguar
          dpkg -L virtualjaguar | head -40
          dpkg -L virtualjaguar | grep -x '/usr/lib/virtualjaguar/librashader.so'
          bash app/packaging/linux/check-librashader.sh /usr/lib/virtualjaguar "${{ matrix.arch }}" build/vj_shader_tests
          sudo apt-get remove -y -qq virtualjaguar

      - uses: actions/upload-artifact@v7
        with:
          name: app-package-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
