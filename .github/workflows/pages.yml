# Build and deploy the GitHub Pages site (https://jaguar.provenance-emu.com/).
#
# The site is generated from committed repo data by scripts/build_site.py
# (python3 stdlib only). It rebuilds on every push to develop that touches
# the site sources or the docs the generator parses. The generator fails
# loudly if docs/cd-boot-matrix.md drifts from the expected format, so a
# red run here means "fix the data or the parser", never "published garbage".

name: Deploy Pages

on:
  push:
    branches: [develop]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - 'scripts/check_downloads.py'
      - 'scripts/testdata/**'
      - 'docs/cd-boot-matrix.md'
      - 'docs/cart-boot-matrix.md'
      # The home page's release log is generated from these.
      - 'docs/RELEASE_NOTES_v*.md'
      # CORE_BASE_VERSION feeds the JSON-LD softwareVersion, so a version
      # bump must redeploy or the structured data goes stale.
      - 'Makefile'
      - '.github/workflows/pages.yml'
  # The Download page links release assets by name, and the app packages
  # carry the version in theirs, so a new release must redeploy.  Releases
  # are published on libretro/virtualjaguar-libretro; the schedule catches
  # them wherever this workflow runs (the Pages fork included).
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the generator derives each page's sitemap <lastmod>
      # from `git log -1 -- <source file>`.  On the default shallow clone
      # (fetch-depth: 1) that reports the checkout commit for every path, so
      # build_site.py detects the shallow clone and falls back to the build
      # date instead of publishing four identical, wrong timestamps.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Direct download links: the generator reads releases/latest and the
      # nightly from the upstream repo by name (not github.repository, so it
      # also works from the Pages fork).  A failed fetch fails the run, so a
      # transient API error keeps the previous deployment.
      - name: Build site
        run: python3 scripts/build_site.py --releases-from-github
        env:
          GH_TOKEN: ${{ github.token }}
      # build_site.py fails on bad input; this fails on bad output (missing
      # or mismatched SEO tags, a second <h1>, a dead local link, malformed
      # JSON-LD or sitemap).  Nothing is deployed if it trips.
      - name: Check generated site
        run: python3 scripts/check_site.py _site
      # The Download page again from the committed offline fixture (latest,
      # nightly and older releases), into a scratch dir: every asset must be
      # listed once and every link must be a real asset of its release.
      - name: Check Download page against the release fixture
        run: |
          python3 scripts/build_site.py --out "$RUNNER_TEMP/site-fixture" --releases scripts/testdata/releases.json
          python3 scripts/check_site.py "$RUNNER_TEMP/site-fixture"
          python3 scripts/check_downloads.py "$RUNNER_TEMP/site-fixture" scripts/testdata/releases.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
