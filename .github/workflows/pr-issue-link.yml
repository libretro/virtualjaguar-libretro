name: PR issue link

# Every PR must be linked to an issue via the **Development** panel.
#
# WHY THIS EXISTS, and why a `Closes #N` in the body is not enough:
#
# GitHub only creates the linked-issue relationship from a closing keyword
# when the PR targets the repository's DEFAULT branch.  This repo's default
# is `master` and virtually every PR targets `develop`, so keywords here
# create **no link at all** -- not just "no auto-close".
#
# Verified 2026-08-20: PRs #537, #539, #542, #544, #545 and #547 all carried
# `Closes #N` and all reported zero linked issues; #546, linked by hand in
# the Development panel, was the only one that reported one.  Timeline
# cross-references still show up, which is exactly why this went unnoticed:
# the issue *looks* connected while the Development panel stays empty, so
# the issue never shows which release or pre-release tag contains the work.
#
# WHAT CHANGED (2026-08-26)
#
# This job used to only *complain*, on the stated grounds that "there is no
# public API to create that link, so it has to be done in the UI".  That is
# no longer true -- and the cost of it being stale was that every new PR
# went red on creation for a step that cannot be performed until after the
# PR exists.
#
# The GraphQL mutation `addCloseIssueReferences` ("Adds one or more pull
# requests as manually linked closing references on an issue") is exactly
# the Development-panel link, and it is idempotent.  So this job now *makes*
# the link from a tag in the PR body instead of demanding a manual step,
# and only fails when there is no tag to act on.
#
# Tag the PR body with any of (case-insensitive):
#
#     Closes #123 / Fixes #123 / Resolves #123 / Refs #123
#     <!-- link-issue: #123 -->      (invisible in the rendered body)
#
# The keyword forms still do nothing on GitHub's side; scripts/pr-link-issue.sh
# is what gives them effect, and that script is also runnable by hand.
#
# Opt out for a genuinely issue-less PR by adding the `no-issue` label.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: write          # addCloseIssueReferences mutates the ISSUE
  pull-requests: read

concurrency:
  group: pr-issue-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR is linked to an issue
    runs-on: ubuntu-latest
    steps:
      # pull_request_target: check out the BASE ref (the default for this
      # event), never the PR head.  The script below runs with a write token,
      # so it must be the trusted copy from the target branch and not a
      # version the PR itself could have edited.
      - uses: actions/checkout@v7

      - name: Link the PR to its issue, or explain what is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          if gh pr view "$PR" --repo "$REPO" --json labels \
                --jq '.labels[].name' | grep -qx 'no-issue'; then
            echo "::notice::'no-issue' label present -- skipping the linked-issue check."
            exit 0
          fi

          # Run the script, capturing both output and exit code.
          # Exit codes:
          #   0 = success (link created or already existed)
          #   1 = generic error (bad args, repo not found, issue validation failed)
          #   2 = no link tag found in the PR body
          #   3 = tag found but the GitHub API mutation failed
          set +e
          out=$(./scripts/pr-link-issue.sh "$PR" --repo "$REPO" 2>&1)
          exit_code=$?
          set -e

          if [ $exit_code -eq 0 ]; then
            echo "$out"
            echo "✅ $out" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$out"

          # pr-link-issue.sh signals its failure mode via exit code:
          #   2 = no link tag found (author must add one)
          #   3 = tag found but GitHub refused the mutation (API error, user may be blameless)
          #
          # Reporting mode (3) as mode (2) sends the author hunting for a tag
          # that is already there.  That happened on PR #725: the body carried
          # `Refs #652` and the HTML comment, but #652 had accumulated so many
          # manually-linked PRs that addCloseIssueReferences returned "Issue
          # exceeds manual reference limit" -- and the old workflow said "no
          # link tag in its body", which is the one thing that was untrue.
          case $exit_code in
            2)
              # No link tag found -- author action needed
              {
                echo "### ❌ This PR is not linked to an issue"
                echo
                echo "No entry in the **Development** panel, and no link tag in the body"
                echo "for CI to act on."
                echo
                echo "**Fix it by editing the PR description** -- add one of:"
                echo
                echo '```'
                echo "Closes #123        Fixes #123        Resolves #123        Refs #123"
                echo "<!-- link-issue: #123 -->     (invisible in the rendered body)"
                echo '```'
                echo
                echo "Editing the description re-runs this job, which will then create the"
                echo "link for you. The Development panel by hand still works, and so does"
                echo "\`scripts/pr-link-issue.sh $PR --repo $REPO\` from a terminal."
                echo
                echo "Note the keywords do **not** link on their own here: GitHub only honours"
                echo "them when a PR targets the default branch (\`master\`), and this PR targets"
                echo "\`develop\`. The tag is a marker for this job, not for GitHub."
                echo
                echo "Without the link the issue never shows which release or pre-release"
                echo "tag contains the work, which is the whole point of linking."
                echo
                echo "Genuinely no issue? Add the \`no-issue\` label."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::PR #$PR has no linked issue and no link tag in its body. Add 'Refs #N' to the description (that re-runs this job and creates the link), or add the 'no-issue' label."
              exit 1
              ;;
            3)
              # Tag found but API mutation failed
              {
                echo "### ⚠️ Could not link -- the GitHub API refused the request"
                echo
                echo "A link tag **was** found in this PR's body, but the attempt to create"
                echo "the link failed. GitHub said:"
                echo
                echo '```'
                echo "$out"
                echo '```'
                echo
                echo "Re-run this job first -- several API errors are transient. If it"
                echo "persists, read the error message carefully. If it mentions a limit"
                echo "(manual reference limit, webhook limit, etc.), the issue may need"
                echo "to be changed or a \`no-issue\` label added."
                echo
                echo "The work is still traceable through the \`Refs #N\` text in the description."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::PR #$PR: the GitHub API refused the link (exit code 3). See the job summary for details and the API error message."
              exit 1
              ;;
            *)
              # Generic error (exit code 1 or other)
              {
                echo "### ⚠️ Could not check the link -- a tool or connection error occurred"
                echo
                echo "The check itself failed. The error was:"
                echo
                echo '```'
                echo "$out"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::PR #$PR: the link check encountered an error (exit code $exit_code). See the job summary."
              exit 1
              ;;
          esac
