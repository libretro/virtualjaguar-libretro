name: Release scripts

# The release signing tooling behind release.yml's stage / verify-signatures
# jobs (issues #1151 / #1152): scripts/release/*.sh and
# app/packaging/linux/verify-appimage.py, tested hermetically by
# test/release/test_release_scripts.sh (fake artifact tree, throwaway minisign
# and GPG keys, no GitHub calls).  Linux additionally downloads the pinned
# appimagetool and signs a real AppImage, which proves the gpgme passphrase
# path app-package.yml relies on; macOS covers the codesign rows.
on:
  push:
    branches: [ master ]
    paths:
      - 'scripts/release/**'
      - '.github/actions/reuse-checkpoint/**'
      - '.github/scripts/checkpoint.cjs'
      - '.github/scripts/tests/checkpoint.test.cjs'
      - 'app/tests/gl_resume_test.py'
      - 'app/test/gl-qualification/gl_qualify.py'
      - 'app/packaging/linux/verify-appimage.py'
      - 'app/packaging/linux/make-appimage.sh'
      - 'test/release/**'
      - '.github/workflows/release-scripts.yml'
  pull_request:
    branches: [ develop, master, 'release/**' ]
    paths:
      - 'scripts/release/**'
      - '.github/actions/reuse-checkpoint/**'
      - '.github/scripts/checkpoint.cjs'
      - '.github/scripts/tests/checkpoint.test.cjs'
      - 'app/tests/gl_resume_test.py'
      - 'app/test/gl-qualification/gl_qualify.py'
      - 'app/packaging/linux/verify-appimage.py'
      - 'app/packaging/linux/make-appimage.sh'
      - 'test/release/**'
      - '.github/workflows/release-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v7

      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign gnupg shellcheck

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install minisign shellcheck

      - name: shellcheck
        run: shellcheck -S warning scripts/release/*.sh app/packaging/linux/make-appimage.sh test/release/test_release_scripts.sh

      - name: Checkpoint dependency and evidence tests
        run: |
          node --test .github/scripts/tests/checkpoint.test.cjs
          python3 -I app/tests/gl_resume_test.py

      - name: Release script suite
        env:
          # Linux: also sign a real AppImage with the pinned appimagetool (network).
          VJ_TEST_REAL_APPIMAGE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: bash test/release/test_release_scripts.sh

  checkpoint-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: first
        uses: ./.github/actions/reuse-checkpoint
        with:
          mode: restore
          lane: checkpoint-contract
          workflow-job: .github/workflows/release-scripts.yml#checkpoint-contract
          dependencies: |
            .github/actions/reuse-checkpoint
            .github/scripts/checkpoint.cjs
          paths: .ci-checkpoint-proof
      - name: Produce the successful output
        if: steps.first.outputs.hit != 'true'
        run: |
          mkdir -p .ci-checkpoint-proof
          echo verified-output > .ci-checkpoint-proof/result.txt
      - if: steps.first.outputs.hit != 'true'
        uses: ./.github/actions/reuse-checkpoint
        with:
          mode: save
          lane: checkpoint-contract
          workflow-job: .github/workflows/release-scripts.yml#checkpoint-contract
          dependencies: |
            .github/actions/reuse-checkpoint
            .github/scripts/checkpoint.cjs
          paths: .ci-checkpoint-proof
      - name: Remove the local copy before restoring
        run: command rm -f .ci-checkpoint-proof/result.txt .ci-checkpoints/checkpoint-contract.json
      - id: second
        uses: ./.github/actions/reuse-checkpoint
        with:
          mode: restore
          lane: checkpoint-contract
          workflow-job: .github/workflows/release-scripts.yml#checkpoint-contract
          dependencies: |
            .github/actions/reuse-checkpoint
            .github/scripts/checkpoint.cjs
          paths: .ci-checkpoint-proof
      - name: Require the verified cache hit
        env:
          HIT: ${{ steps.second.outputs.hit }}
        run: |
          test "$HIT" = true
          grep -x verified-output .ci-checkpoint-proof/result.txt
