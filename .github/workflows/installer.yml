name: Installer scripts

# tools/install.sh (POSIX sh) and tools/install.ps1 (Windows PowerShell 5.1 + 7):
# the core / app / both installers behind the site's copy-paste lines (#840).
# The suites in test/installer/ run them against a fake release tree over file://
# with HOME / LOCALAPPDATA in a temp dir, so nothing real is installed.
#
# The app's path filter (app.yml) does not cover tools/, hence a workflow of its own.

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'tools/install.sh'
      - 'tools/install.ps1'
      - 'test/installer/**'
      - 'site/pages/index.html'
      - '.github/workflows/installer.yml'
  pull_request:
    branches: [ develop, master ]
    paths:
      - 'tools/install.sh'
      - 'tools/install.ps1'
      - 'test/installer/**'
      - 'site/pages/index.html'
      - '.github/workflows/installer.yml'
  workflow_dispatch:
    inputs:
      qualification_tag:
        description: 'Published candidate tag to install on disposable hosts (empty = hermetic tests only)'
        default: ''
        type: string
      qualification_intel_only:
        description: 'Run only clean Intel macOS qualification (other qualification runs already dispatched)'
        default: false
        type: boolean
      qualification_sha:
        description: 'Expected published candidate SHA'
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-sh:
    if: ${{ !inputs.qualification_intel_only }}
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest ]
    steps:
    - uses: actions/checkout@v7

    - name: Tools (shellcheck, dash, zsh, busybox)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq shellcheck dash zsh busybox zip

    - name: Tools (shellcheck, dash)
      if: runner.os == 'macOS'
      run: brew install shellcheck dash

    # warning and above: the style-level SC2015 (A && B || C) hits idioms that are intentional
    # in this script (and in the original), and differs between shellcheck releases.
    - name: shellcheck
      run: shellcheck -s sh -S warning tools/install.sh

    - name: Syntax under every shell
      run: |
        for s in sh dash bash zsh "busybox ash"; do
          cmd=${s%% *}
          command -v "$cmd" >/dev/null 2>&1 || { echo "skip $s"; continue; }
          $s -n tools/install.sh && echo "ok  $s"
        done

    - name: Installer suite (sh bash dash zsh busybox)
      run: bash test/installer/test_install_sh.sh

  install-ps1:
    if: ${{ !inputs.qualification_intel_only }}
    name: install.ps1 (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ powershell, pwsh ]
    steps:
    - uses: actions/checkout@v7

    - name: PSScriptAnalyzer
      if: matrix.shell == 'pwsh'
      shell: pwsh
      run: |
        if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
        # Excluded on purpose:
        #   PSAvoidUsingWriteHost   an interactive installer; its output must not enter the pipeline
        #   PSReviewUnusedParameter the script-level params are read by the helper functions
        #                           through dynamic scoping, which the rule cannot see
        #   PSAvoidUsingEmptyCatchBlock  best-effort probes (registry, winget, COM) that may fail
        #   PSUseSingularNouns / PSUseApprovedVerbs / ShouldProcess  internal helper naming
        # Everything else at Warning or above must be clean.
        $exclude = 'PSAvoidUsingWriteHost', 'PSReviewUnusedParameter', 'PSAvoidUsingEmptyCatchBlock',
                    'PSUseSingularNouns', 'PSUseApprovedVerbs', 'PSUseShouldProcessForStateChangingFunctions'
        $r = Invoke-ScriptAnalyzer -Path tools/install.ps1 -Severity Error, Warning -ExcludeRule $exclude
        $r | Format-Table -AutoSize | Out-String | Write-Host
        if ($r) { exit 1 }

    # `shell:` cannot take a matrix expression, so one step per host.
    - name: Installer suite (Windows PowerShell 5.1)
      if: matrix.shell == 'powershell'
      shell: powershell
      run: powershell -NoProfile -ExecutionPolicy Bypass -File test/installer/test_install_ps1.ps1

    - name: Installer suite (PowerShell 7)
      if: matrix.shell == 'pwsh'
      shell: pwsh
      run: pwsh -NoProfile -ExecutionPolicy Bypass -File test/installer/test_install_ps1.ps1

  qualify-published:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification_tag != ''
    name: Published install/update (${{ matrix.os }}, ${{ matrix.ps }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.qualification_intel_only && '[{"os":"macos-15-intel","ps":"pwsh"}]' || '[{"os":"windows-latest","ps":"powershell"},{"os":"windows-latest","ps":"pwsh"},{"os":"macos-latest","ps":"pwsh"},{"os":"macos-15-intel","ps":"pwsh"},{"os":"ubuntu-22.04","ps":"pwsh"},{"os":"ubuntu-24.04-arm","ps":"pwsh"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends retroarch libsdl2-2.0-0 libgl1 libegl1 libx11-6 libxcursor1 libxi6 libxrandr2 libasound2
      - name: Real RetroArch frontend (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install retroarch --yes --no-progress
      - name: Real RetroArch frontend (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask retroarch
      - name: Install and update actual published packages
        env:
          QUALIFICATION_TAG: ${{ inputs.qualification_tag }}
          QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
          QUALIFICATION_PS: ${{ matrix.ps }}
        shell: bash
        run: python test/installer/qualify_published.py --tag "$QUALIFICATION_TAG" --sha "$QUALIFICATION_SHA" --powershell "$QUALIFICATION_PS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qualification-${{ matrix.os }}-${{ matrix.ps }}
          path: ${{ runner.temp }}/vj-published-qualification/
          if-no-files-found: warn
