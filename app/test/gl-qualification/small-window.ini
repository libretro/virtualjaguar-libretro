# Seeded as config.ini into every launch's data folder by gl_qualify.py --seed-config on the hosted
# macOS leg, whose display is too small for the default 960x760 window (it came back clamped to
# 960x642, ~45 s a launch on Apple's software renderer; run 41571727219 managed 205 of 500 presets in
# 150 min).  640x480 fits that display and keeps crt-royale above the 341 px its mask passes need.
# Not 480x360: with ImGui's extra OS windows on (the default) a 480x360 window captures uniform
# white (runs 41727418224 and 41760278887).  Screenshots and goldens of that leg are this size.
window.w=640
window.h=480
