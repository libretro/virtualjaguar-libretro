# Seeded as config.ini into every launch's data folder by gl_qualify.py --seed-config on legs whose
# display or software renderer makes the default 960x760 window a bad fit (hosted macOS: the display is
# too small for it, the window came back clamped to 960x642 and ~45 s a launch; run 41571727219 managed
# 205 of 500 presets in 150 min).  640x480 fits that display, keeps crt-royale above the 341 px its mask
# passes need, and is not the 4:3 480x360 of run 41727418224, whose every capture came back a uniform
# white (the "Capture diagnostics" step of that leg tries the window sizes side by side).  Screenshots
# and goldens of that leg are this size.
window.w=640
window.h=480
