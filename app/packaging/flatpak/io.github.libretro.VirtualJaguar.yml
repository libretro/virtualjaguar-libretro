# Flatpak manifest for the Virtual Jaguar desktop app (#839).
#
# This is the CI manifest: it builds the checked-out tree (type: dir), so app-package.yml and a
# local `flatpak-builder` run exercise exactly what is in the working copy.  The Flathub variant
# (same module, the source tree taken from the release tag instead) is DERIVED from this file by
# app/packaging/manifests/render.sh -- never edit a second copy.  Nothing here is submitted to
# Flathub by CI; see app/packaging/README.md.
#
# Flatpak builds have NO network, so every input the CMake configure would download is a declared
# source with a SHA-256 below, placed under third_party/ and handed over through the app's offline
# knobs.  -DFETCHCONTENT_FULLY_DISCONNECTED=ON makes a missed download fail the build instead of
# hanging on a sandboxed socket.
#
#   local build:  flatpak-builder --user --install-deps-from=flathub --force-clean --install \
#                   build-dir app/packaging/flatpak/io.github.libretro.VirtualJaguar.yml
#
# NOT shipped yet: librashader (shader presets).  Upstream publishes no Linux binary and building
# the Rust library here needs cargo vendoring.  The app starts without it and reports the shader
# runtime as unavailable; the slang-shaders presets are bundled for when it is added.
app-id: io.github.libretro.VirtualJaguar
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: virtualjaguar
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all          # gamepads (evdev / hidraw) and the GPU
  - --share=network       # RetroAchievements, box art and database downloads, netplay
  # ROM folders: the library scans folders the user chose, and a CD image (.cue) needs its
  # sibling .bin tracks, which the file-chooser portal does not grant.  Read-only, and only
  # the home directory (save data lives in the app's own ~/.var/app/<id>/ directory).
  - --filesystem=home:ro
modules:
  - name: virtualjaguar
    buildsystem: cmake-ninja
    builddir: true
    subdir: app
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DVJ_APP_BUILD_TESTS=OFF
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - -DFETCHCONTENT_SOURCE_DIR_SDL3=/run/build/virtualjaguar/third_party/SDL3
      - -DFETCHCONTENT_SOURCE_DIR_IMGUI=/run/build/virtualjaguar/third_party/imgui
      - -DFETCHCONTENT_SOURCE_DIR_RCHEEVOS=/run/build/virtualjaguar/third_party/rcheevos
      - -DVJ_APP_CHEATS_SOURCE_DIR=/run/build/virtualjaguar/third_party/cheats
      - -DVJ_APP_FETCH_LIBRASHADER=OFF
      - -DVJ_LIBRASHADER_INCLUDE_DIR=/run/build/virtualjaguar/third_party/librashader-include
      - -DVJ_SLANG_SHADERS_ARCHIVE=/run/build/virtualjaguar/third_party/slang-shaders.tar.gz
      - -DVJ_APP_LIBRETRO_DB_DIR=/run/build/virtualjaguar/third_party/libretro-db
    post-install:
      # The data the app looks for beside its executable (SDL_GetBasePath() = /app/bin/) must be
      # in the install tree, and the HTTP backend must have found libcurl: a configure that
      # quietly degraded (a missed offline knob) fails here instead of shipping a hollow app.
      - test -f /app/bin/virtualjaguar
      - test -f "/app/bin/cheats/Doom.cht"
      - test -f "/app/bin/libretro-db/Atari - Jaguar.dat"
      - test -d /app/bin/shaders/slang-shaders
      - test -f /app/share/metainfo/io.github.libretro.VirtualJaguar.metainfo.xml
      - test -f /app/share/applications/io.github.libretro.VirtualJaguar.desktop
      - ldd /app/bin/virtualjaguar | tee /tmp/vj-ldd.txt
      - grep -q libcurl /tmp/vj-ldd.txt
      - "! grep -q 'not found' /tmp/vj-ldd.txt"
    sources:
      # BEGIN-LOCAL-SOURCE (render.sh swaps this block for the release tag's git source)
      - type: dir
        path: ../../..
        skip:
          - .git
          - .github
          - .flatpak-builder
          - flatpak_app
          - repo
          - site
          - docs
          - test
      # END-LOCAL-SOURCE
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz
        sha256: 7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68
        dest: third_party/SDL3
      - type: archive
